name: Security CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    name: Secret scan and gate
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      status: ${{ steps.scanner.outputs.status }}
      reported: ${{ steps.report.outputs.reported }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Scan checked-out commit with pinned Gitleaks
        id: scanner
        shell: bash
        env:
          SCAN_SHA: ${{ github.sha }}
          SCAN_BRANCH: ${{ github.event_name == 'pull_request' && github.head_ref || github.ref_name }}
          SCAN_TRIGGER: ${{ github.event_name == 'pull_request' && 'CI_PR' || 'CI_PUSH' }}
          POLICY_REF: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.sha }}
          RANGE_START: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SCAN_SHA"
          trap 'rm -f "$RUNNER_TEMP/gitleaks-raw.json" "$RUNNER_TEMP/gitleaks.toml"' EXIT
          code=2
          if git show "$POLICY_REF:config/gitleaks.toml" > "$RUNNER_TEMP/gitleaks.toml"; then
            range="$SCAN_SHA"
            if [[ "$RANGE_START" =~ ^[0-9a-f]{40}$ ]] && git merge-base --is-ancestor "$RANGE_START" "$SCAN_SHA" && [[ "$RANGE_START" != "$SCAN_SHA" ]]; then
              range="$RANGE_START..$SCAN_SHA"
            fi
            set +e
            docker run --rm --network none --read-only --tmpfs /tmp \
              -e GIT_CONFIG_COUNT=1 -e GIT_CONFIG_KEY_0=safe.directory -e GIT_CONFIG_VALUE_0=/repo \
              --mount "type=bind,src=$PWD,dst=/repo,readonly" \
              --mount "type=bind,src=$RUNNER_TEMP,dst=/out" -w /repo \
              ghcr.io/gitleaks/gitleaks@sha256:691af3c7c5a48b16f187ce3446d5f194838f91238f27270ed36eef6359a574d9 \
              git /repo --config=/out/gitleaks.toml "--log-opts=$range" \
              --report-format=json --report-path=/out/gitleaks-raw.json --redact=100 \
              --no-banner --no-color --log-level=error --exit-code=1 --timeout=60
            code=$?
            set -e
          fi
          status=$(node scripts/ci-normalize-report.mjs "$code" "$RUNNER_TEMP/gitleaks-raw.json" "$RUNNER_TEMP/scan-result.json")
          echo "status=$status" >> "$GITHUB_OUTPUT"
          echo "Scan outcome: $status for $SCAN_SHA"
      - name: Report sanitized result from trusted main push
        id: report
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.scanner.outputs.status != ''
        continue-on-error: true
        env:
          SECRET_SHIELD_API_BASE: ${{ vars.SECRET_SHIELD_API_BASE }}
          SECRET_SHIELD_REPOSITORY_ID: ${{ vars.SECRET_SHIELD_REPOSITORY_ID }}
          SECRET_SHIELD_CI_CREDENTIAL: ${{ secrets.SECRET_SHIELD_CI_CREDENTIAL }}
        run: |
          node scripts/ci-report.mjs "$RUNNER_TEMP/scan-result.json"
          echo 'reported=true' >> "$GITHUB_OUTPUT"
      - name: Enforce clean exact-commit gate
        if: always()
        env:
          SCAN_STATUS: ${{ steps.scanner.outputs.status }}
        run: |
          if [ "$SCAN_STATUS" != CLEAN ]; then
            echo "Build blocked: scan outcome is ${SCAN_STATUS:-missing}."
            exit 1
          fi
          echo "Clean scan of $GITHUB_SHA confirmed."

  build:
    name: Backend and frontend checks
    needs: scan
    if: needs.scan.result == 'success' && needs.scan.outputs.status == 'CLEAN'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Backend tests and package
        run: sh ./mvnw -B verify
      - name: Workflow normalization and retry tests
        run: node --test scripts/ci-workflow.test.mjs
      - name: Frontend tests and production build
        working-directory: frontend
        run: |
          npm ci
          npm test
          npm run build
      - name: Build backend and frontend containers
        run: |
          docker build --pull -f Dockerfile -t secret-shield-backend:ci .
          docker build --pull -f frontend/Dockerfile -t secret-shield-frontend:ci frontend

  release_candidate:
    name: Trusted release candidate
    needs: [scan, build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.scan.result == 'success' && needs.scan.outputs.status == 'CLEAN' && needs.scan.outputs.reported == 'true' && needs.build.result == 'success'
    runs-on: ubuntu-24.04
    permissions: {}
    steps:
      - name: Record eligible commit
        env:
          ELIGIBLE_SHA: ${{ github.sha }}
        run: echo "Verified release candidate $ELIGIBLE_SHA."

  publish:
    name: Publish exact-commit images
    needs: [scan, build, release_candidate]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'aasthashrimal/Secret-Shield' && needs.scan.outputs.status == 'CLEAN' && needs.release_candidate.result == 'success' && vars.GHCR_PUBLISH_ENABLED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Publish the checked and reported commit
        shell: bash
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/ci-publish-images.sh

  bootstrap_publish:
    name: One-time bootstrap image publish
    needs: [scan, build]
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && github.repository == 'aasthashrimal/Secret-Shield' && needs.scan.result == 'success' && needs.scan.outputs.status == 'CLEAN' && needs.build.result == 'success' && vars.BOOTSTRAP_PUBLISH_ENABLED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Publish one scanned main commit for initial cloud bootstrap
        shell: bash
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/ci-publish-images.sh

  deploy:
    name: Deploy verified images to Azure
    needs: [scan, build, release_candidate, publish]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'aasthashrimal/Secret-Shield' && needs.scan.outputs.status == 'CLEAN' && needs.release_candidate.result == 'success' && needs.publish.result == 'success' && vars.AZURE_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    concurrency:
      group: azure-dev-deployment
      cancel-in-progress: false
    environment: azure-dev
    permissions:
      contents: read
      id-token: write
    env:
      AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
    steps:
      - name: Verify public, exact-commit images
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ ]]
          docker manifest inspect "ghcr.io/aasthashrimal/secret-shield-backend:$GITHUB_SHA" >/dev/null
          docker manifest inspect "ghcr.io/aasthashrimal/secret-shield-frontend:$GITHUB_SHA" >/dev/null
      - name: Sign in with environment-scoped OIDC
        shell: bash
        run: |
          set -euo pipefail
          test -n "$AZURE_CLIENT_ID" && test -n "$AZURE_TENANT_ID" && test -n "$AZURE_SUBSCRIPTION_ID"
          test "$AZURE_SUBSCRIPTION_ID" = '90f1336d-e3cc-4aae-87f7-fcd90e2b877c'
          token=$(curl -fsS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=api://AzureADTokenExchange" | jq -er .value)
          az login --service-principal --username "$AZURE_CLIENT_ID" --tenant "$AZURE_TENANT_ID" \
            --federated-token "$token" --output none
          unset token
          az account set --subscription "$AZURE_SUBSCRIPTION_ID"
          test "$(az account show --query id -o tsv)" = "$AZURE_SUBSCRIPTION_ID"
      - name: Point both apps at this commit
        shell: bash
        run: |
          set -euo pipefail
          az webapp config container set --resource-group rg-secretshield-dev-zboc5k \
            --name secretshield-dev-zboc5k-api \
            --container-image-name "ghcr.io/aasthashrimal/secret-shield-backend:$GITHUB_SHA" \
            --container-registry-url https://ghcr.io --output none
          az webapp config container set --resource-group rg-secretshield-dev-zboc5k \
            --name secretshield-dev-zboc5k-web \
            --container-image-name "ghcr.io/aasthashrimal/secret-shield-frontend:$GITHUB_SHA" \
            --container-registry-url https://ghcr.io --output none
      - name: Check both live containers and proxy
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS --retry 18 --retry-delay 10 --retry-all-errors --max-time 10 \
            https://secretshield-dev-zboc5k-api.azurewebsites.net/api/health/live >/dev/null
          curl -fsS --retry 18 --retry-delay 10 --retry-all-errors --max-time 10 \
            https://secretshield-dev-zboc5k-web.azurewebsites.net/health >/dev/null
          curl -fsS --retry 18 --retry-delay 10 --retry-all-errors --max-time 10 \
            https://secretshield-dev-zboc5k-web.azurewebsites.net/api/health/live >/dev/null
