spring:
  application:
    name: secret-shield

  profiles:
    default: local

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC

  flyway:
    locations: classpath:db/migration
    default-schema: public
    schemas: public
    baseline-on-migrate: false
    baseline-version: 0
    clean-disabled: true

secretshield:
  database:
    adopt-existing: false
  admin-bootstrap-enabled: ${ADMIN_BOOTSTRAP_ENABLED:false}
  admin-bootstrap-email: ${ADMIN_BOOTSTRAP_EMAIL:}
  admin-bootstrap-exit: ${ADMIN_BOOTSTRAP_EXIT:false}

jwt:
  secret: ${JWT_SECRET:}
  expiration: 3600000

server:
  port: 8080

app:
  frontend-origin: ${FRONTEND_ORIGIN:http://localhost:5173}
