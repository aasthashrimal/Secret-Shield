spring:
  application:
    name: secret-shield

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/secret_shield_db}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true

jwt:
  secret: ${JWT_SECRET}
  expiration: 3600000

server:
  port: 8080