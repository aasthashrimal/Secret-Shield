spring:
  application:
    name: secret-shield

  profiles:
    default: local

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    locations: classpath:db/migration
    default-schema: public
    schemas: public
    baseline-on-migrate: false
    baseline-version: 0
    clean-disabled: true

secretshield:
  database:
    adopt-existing: false
  admin-bootstrap-enabled: ${ADMIN_BOOTSTRAP_ENABLED:false}
  admin-bootstrap-email: ${ADMIN_BOOTSTRAP_EMAIL:}
  admin-bootstrap-exit: ${ADMIN_BOOTSTRAP_EXIT:false}
  scanner:
    workspace: ${SCANNER_WORKSPACE:target/scanner-workspace}
    gitleaks-path: ${GITLEAKS_PATH:gitleaks}
    config-path: ${GITLEAKS_CONFIG_PATH:config/gitleaks.toml}
    version: 8.30.0
    timeout-seconds: ${SCANNER_TIMEOUT_SECONDS:60}
    max-report-bytes: 5242880
    max-log-bytes: 65536
  notifications:
    provider: ${NOTIFICATION_PROVIDER:disabled}
    recipients: ${NOTIFICATION_RECIPIENTS:}
    public-base-url: ${NOTIFICATION_PUBLIC_BASE_URL:http://localhost:8080}
    scheduled: ${NOTIFICATION_SCHEDULED:true}
    acs:
      connection-string: ${ACS_CONNECTION_STRING:}
      sender: ${ACS_SENDER_ADDRESS:}

jwt:
  secret: ${JWT_SECRET:}
  expiration: 3600000

server:
  port: 8080

app:
  frontend-origin: ${FRONTEND_ORIGIN:http://localhost:5173}
