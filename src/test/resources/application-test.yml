# Explicit isolated database inputs; never fall back to the development DB_* values.
spring:
  datasource:
    url: ${TEST_DB_URL}
    username: ${TEST_DB_USERNAME}
    password: ${TEST_DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

jwt:
  # Synthetic test-only signing key. This resource is not packaged in the app jar.
  secret: synthetic-test-only-signing-key-never-use-outside-tests
  expiration: 1000

debug: false
logging:
  level:
    root: WARN
